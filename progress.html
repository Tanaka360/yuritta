<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YURITTA — Progress</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f5f0;--bg2:#f2ede6;--surface:#ffffff;--surface2:#fdf8f2;--surface3:#f4ede2;--border:#e2d8cc;--border2:#d4c8b8;--navy:#1a3558;--navy2:#0f2240;--navy-dim:rgba(26,53,88,0.08);--green:#2d8a4e;--green2:#1a5a32;--green-dim:rgba(45,138,78,0.1);--green-mid:#a8d8b8;--text:#1a0a00;--text2:#5a4a38;--text3:#8a7a6a;--text4:#b4a898;--red:#c0392b;--chitenge1:#1a3558;--chitenge2:#2d8a4e;--chitenge3:#c8900a;--chitenge4:#7a1a4a;--chitenge5:#e8c020;}
[data-theme="dark"]{--bg:#0e1219;--bg2:#131820;--surface:#1a2232;--surface2:#1f2a3e;--surface3:#243048;--border:rgba(180,160,130,0.12);--border2:rgba(180,160,130,0.2);--navy:#4a7ab8;--navy2:#3a6aa8;--navy-dim:rgba(74,122,184,0.12);--green:#3aaa60;--green2:#4eca78;--green-dim:rgba(58,170,96,0.12);--green-mid:rgba(58,170,96,0.3);--text:#f0ebe2;--text2:#b4a898;--text3:#7a6a58;--text4:#4a3a2a;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;font-weight:300;min-height:100vh;transition:background 0.3s,color 0.3s;}
.chitenge-strip{height:4px;background:repeating-linear-gradient(90deg,var(--chitenge1) 0px,var(--chitenge1) 12px,var(--chitenge2) 12px,var(--chitenge2) 24px,var(--chitenge3) 24px,var(--chitenge3) 30px,var(--chitenge4) 30px,var(--chitenge4) 42px,var(--chitenge5) 42px,var(--chitenge5) 48px,var(--chitenge1) 48px);}
.topbar{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 1.2rem;border-bottom:0.5px solid var(--border);background:var(--navy2);}
.logo{display:flex;align-items:center;gap:0.6rem;text-decoration:none;}
.logo-mark{width:26px;height:26px;border-radius:7px;background:var(--surface);display:flex;align-items:center;justify-content:center;}
.logo-ring{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--navy2);border-top-color:var(--green);border-right-color:var(--green);}
.logo-text{color:white;font-size:0.95rem;font-weight:800;letter-spacing:0.12em;}
.topbar-right{display:flex;align-items:center;gap:0.3rem;}
.nav-link{font-family:'Space Mono',monospace;font-size:0.58rem;letter-spacing:0.04em;text-transform:uppercase;color:rgba(255,255,255,0.55);text-decoration:none;padding:0.35rem 0.7rem;border-radius:6px;transition:all 0.2s;border:none;background:none;cursor:pointer;}
.nav-link:hover{color:white;background:rgba(255,255,255,0.1);}
.page-badge{font-family:'Space Mono',monospace;font-size:0.56rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--green2);background:var(--green-dim);border:0.5px solid var(--green-mid);padding:0.22rem 0.65rem;border-radius:4px;}
.theme-toggle{width:32px;height:18px;border-radius:9px;background:rgba(255,255,255,0.15);border:0.5px solid rgba(255,255,255,0.2);cursor:pointer;position:relative;transition:background 0.3s;flex-shrink:0;}
.theme-toggle::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:white;transition:transform 0.3s;}
[data-theme="dark"] .theme-toggle::after{transform:translateX(14px);}
.main{max-width:900px;margin:0 auto;padding:2.5rem 1.5rem;}
.page-header{margin-bottom:2.2rem;}
.page-header h1{font-family:'Outfit',sans-serif;font-size:1.9rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:0.3rem;}
.page-header h1 span{color:var(--green);}
.page-header p{color:var(--text2);font-size:0.875rem;}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:0.8rem;margin-bottom:2.2rem;}
.stat-card{background:var(--surface);border:0.5px solid var(--border2);border-radius:9px;padding:1.1rem;text-align:center;position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2.5px;background:linear-gradient(90deg,var(--navy2),var(--green));}
.stat-val{font-family:'Outfit',sans-serif;font-size:1.9rem;font-weight:800;color:var(--navy);display:block;margin-bottom:0.25rem;line-height:1;}
.stat-lbl{font-family:'Space Mono',monospace;font-size:0.52rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3);}
.section-head{display:flex;align-items:center;gap:0.7rem;margin-bottom:0.9rem;}
.section-title{font-family:'Space Mono',monospace;font-size:0.55rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--text3);}
.section-line{flex:1;height:0.5px;background:var(--border);}
.filter-row{display:flex;gap:0.35rem;margin-bottom:1.3rem;flex-wrap:wrap;}
.filter-btn{font-family:'Space Mono',monospace;font-size:0.56rem;letter-spacing:0.04em;text-transform:uppercase;padding:0.28rem 0.75rem;border-radius:5px;cursor:pointer;border:0.5px solid var(--border);color:var(--text3);background:none;transition:all 0.18s;}
.filter-btn:hover,.filter-btn.active{background:var(--navy-dim);color:var(--navy);border-color:rgba(26,53,88,0.25);}
.chart-wrap{height:110px;display:flex;align-items:flex-end;gap:0.5rem;margin-bottom:2.2rem;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:0.25rem;}
.bar-fill{width:100%;border-radius:3px 3px 0 0;min-height:3px;}
.bar-val{font-family:'Space Mono',monospace;font-size:0.5rem;color:var(--text3);}
.table-wrap{border:0.5px solid var(--border);border-radius:9px;overflow:hidden;margin-bottom:2rem;}
table{width:100%;border-collapse:collapse;}
thead th{font-family:'Space Mono',monospace;font-size:0.52rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);padding:0.7rem 1rem;text-align:left;border-bottom:0.5px solid var(--border);background:var(--surface2);}
tbody td{padding:0.8rem 1rem;border-bottom:0.5px solid var(--border);font-size:0.82rem;color:var(--text2);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--navy-dim);}
.sub-badge{font-family:'Space Mono',monospace;font-size:0.52rem;letter-spacing:0.04em;text-transform:uppercase;padding:0.15rem 0.5rem;border-radius:4px;background:var(--surface3);color:var(--text3);border:0.5px solid var(--border);}
.score-badge{font-family:'Space Mono',monospace;font-size:0.62rem;font-weight:700;padding:0.18rem 0.55rem;border-radius:4px;}
.s-high{background:var(--green-dim);color:var(--green2);border:0.5px solid var(--green-mid);}
.s-mid{background:var(--navy-dim);color:var(--navy);border:0.5px solid rgba(26,53,88,0.2);}
.s-low{background:rgba(192,57,43,0.07);color:#8b1a1a;border:0.5px solid rgba(192,57,43,0.18);}
.clear-btn{font-family:'Space Mono',monospace;font-size:0.52rem;letter-spacing:0.04em;text-transform:uppercase;background:none;border:0.5px solid var(--border);color:var(--text3);padding:0.28rem 0.65rem;border-radius:5px;cursor:pointer;transition:all 0.2s;float:right;margin-top:-1.7rem;margin-bottom:0.8rem;}
.clear-btn:hover{border-color:var(--red);color:var(--red);}
.empty{text-align:center;padding:4rem 2rem;}
.empty-icon{font-size:2.8rem;margin-bottom:1rem;display:block;opacity:0.35;}
.empty h3{font-family:'Outfit',sans-serif;font-size:1.15rem;font-weight:700;margin-bottom:0.4rem;}
.empty p{color:var(--text2);font-size:0.875rem;margin-bottom:1.3rem;}
.cta{display:inline-block;background:var(--navy2);color:white;padding:0.7rem 1.4rem;border-radius:8px;font-family:'Space Mono',monospace;font-size:0.62rem;letter-spacing:0.06em;text-transform:uppercase;text-decoration:none;transition:all 0.2s;}
.cta:hover{background:var(--navy);transform:translateY(-1px);}
@media(max-width:600px){.stats-row{grid-template-columns:1fr 1fr;}.main{padding:1.5rem 1rem;}}
</style>
</head>

<div class="main">
  <div class="page-header">
    <h1>Your <span>Progress.</span></h1>
    <p>Every quiz across all your programmes is tracked here.</p>
  </div>
  <div class="stats-row">
    <div class="stat-card"><span class="stat-val" id="totalQ">0</span><span class="stat-lbl">Quizzes Done</span></div>
    <div class="stat-card"><span class="stat-val" id="avgS">—</span><span class="stat-lbl">Avg Score</span></div>
    <div class="stat-card"><span class="stat-val" id="bestS">—</span><span class="stat-lbl">Best Score</span></div>
    <div class="stat-card"><span class="stat-val" id="subCount">0</span><span class="stat-lbl">Programmes</span></div>
  </div>
  <div id="content"></div>
</div>

<script>
function toggleTheme(){const h=document.documentElement;const d=h.getAttribute('data-theme')==='dark';h.setAttribute('data-theme',d?'light':'dark');localStorage.setItem('yuritta_theme',d?'light':'dark');}
(function(){const s=localStorage.getItem('yuritta_theme');if(s)document.documentElement.setAttribute('data-theme',s);})();
const LABELS={economics:'Economics',clinical:'Clinical Sciences',development:'Development Studies'};
let activeFilter='all';
function render(){
  const hist=JSON.parse(localStorage.getItem('yuritta_history')||'[]');
  const el=document.getElementById('content');
  if(!hist.length){el.innerHTML=`<div class="empty"><span class="empty-icon">📊</span><h3>No data yet</h3><p>Complete your first quiz to start tracking progress.</p><a href="quiz.html" class="cta">Start a Quiz →</a></div>`;return;}
  const scores=hist.map(h=>h.score);const subs=[...new Set(hist.map(h=>h.subject))];
  document.getElementById('totalQ').textContent=hist.length;
  document.getElementById('avgS').textContent=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length)+'%';
  document.getElementById('bestS').textContent=Math.max(...scores)+'%';
  document.getElementById('subCount').textContent=subs.length;
  const filtered=activeFilter==='all'?hist:hist.filter(h=>h.subject===activeFilter);
  const tabs=['all',...subs].map(s=>`<button class="filter-btn${s===activeFilter?' active':''}" onclick="setFilter('${s}')">${s==='all'?'All':(LABELS[s]||s)}</button>`).join('');
  const recent=filtered.slice(-10);
  const bars=recent.map(h=>{const bg=h.score>=80?'var(--green)':'var(--navy)';return `<div class="bar-col"><div class="bar-fill" style="height:${h.score}px;background:${bg};opacity:${h.score>=80?0.85:0.6}"></div><div class="bar-val">${h.score}%</div></div>`;}).join('');
  const rows=filtered.slice().reverse().map(h=>{const cls=h.score>=80?'s-high':h.score>=50?'s-mid':'s-low';return `<tr><td>${h.date}</td><td><span class="sub-badge">${LABELS[h.subject]||h.subject||'—'}</span></td><td>${h.topic}</td><td>${h.correct}/${h.total}</td><td><span class="score-badge ${cls}">${h.score}%</span></td></tr>`;}).join('');
  el.innerHTML=`<div class="filter-row">${tabs}</div><div class="section-head"><span class="section-title">Score Trend</span><div class="section-line"></div></div><div class="chart-wrap">${bars}</div><div class="section-head"><span class="section-title">Quiz History</span><div class="section-line"></div></div><button class="clear-btn" onclick="clearAll()">Clear All</button><div class="table-wrap"><table><thead><tr><th>Date</th><th>Programme</th><th>Course</th><th>Result</th><th>Score</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function setFilter(f){activeFilter=f;render();}
function clearAll(){if(confirm('Clear all quiz history?')){localStorage.removeItem('yuritta_history');location.reload();}}
render();
</script>
